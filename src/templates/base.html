<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site_title }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ base }}static/awsm.min.css">
  <link rel="stylesheet" href="{{ base }}static/site.css">
  <link rel="stylesheet" href="{{ base }}static/syntax.css">
  <link rel="alternate" type="application/atom+xml" title="{{ site_title }}" href="{{ base }}feed.xml">
  <meta property="og:site_name" content="{{ site_title }}">
  <meta property="og:title" content="{{ og.title }}">
  <meta property="og:url" content="{{ og.url }}">
  <meta property="og:type" content="{{ og.type }}">
  {% if og.description %}<meta property="og:description" content="{{ og.description }}">{% endif %}
  {% if og.published %}<meta property="article:published_time" content="{{ og.published }}">{% endif %}
  {% for tag in og.tags %}<meta property="article:tag" content="{{ tag }}">{% endfor %}
  <meta name="twitter:card" content="summary">
</head>
<body>
<header>
  <h1><a href="{{ base }}">{{ site_title }}</a></h1>
  <nav>
    <ul>
      <li><a href="{{ base }}">Posts</a></li>
      <li><a href="{{ base }}tags.html">Tags</a></li>
      <li><a href="{{ base }}feed.xml">Feed</a></li>
    </ul>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
