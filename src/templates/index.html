{% extends "base.html" %}
{% block content %}
<nav class="breadcrumb"><a href="{{ tld }}">~</a> / <a href="{{ base }}">{{ repo }}</a></nav>
<h1><a href="{{ base }}">{{ site_title }}</a></h1>
<article>
  <ul class="timeline">
    {% for post in posts %}
    <li>
      <a href="{{ base }}{{ post.number }}/">
        <time datetime="{{ post.created_at }}">{{ post.created_at|datefmt }}</time> {{ post.title }}
      </a>
    </li>
    {% else %}
    <li>Nothing here yet. Open an issue to publish a post.</li>
    {% endfor %}
  </ul>
</article>
<nav class="bottom-links">
  <a href="{{ base }}tags/">Tags</a> · <a href="{{ base }}feed.xml">Feed</a>
</nav>
{% endblock %}
