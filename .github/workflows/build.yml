name: build site

on:
  issues:
    types: [opened, edited, deleted, closed, reopened, labeled, unlabeled, transferred]
  issue_comment:
    types: [created, edited, deleted]
  push:
    branches: [main, master]
    paths:
      - src/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libgbm1 || true
        if: runner.os == 'Linux'
      - run: uv sync --frozen
      - run: uv run python src/main.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Custom domains serve from the root; project sites keep /<repo>.
          SITE_URL: ${{ endsWith(steps.pages.outputs.host, '.github.io') && steps.pages.outputs.base_url || steps.pages.outputs.origin }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
